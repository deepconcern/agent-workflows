name: Publish releases

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency:
      group: agent-workflows-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      issues: read
    steps:
      - name: Check out the merged revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Replay releases on main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE_TAG: ${{ vars.RELEASE_BASE_TAG }}
          RELEASE_AFTER_SHA: ${{ vars.RELEASE_AFTER_SHA }}
          RELEASE_CORRECTIONS: ${{ vars.RELEASE_CORRECTIONS }}
          RELEASE_DIRECT_PUSH_SHAS: ${{ vars.RELEASE_DIRECT_PUSH_SHAS }}
        run: python3 .github/release/release.py
